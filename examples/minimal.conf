# Minimal ServIO configuration — single virtual host on a non-privileged
# port, serves files from html/ with directory listing fallback and accepts
# uploads on /upload (stored under /tmp).

http {
    client_max_body_size 30m;

    server {
        listen 8081;

        location / {
            root html;
            index index.html;
            autoindex on;
        }

        location /upload {
            allowed_methods POST;
            upload_store /tmp;
        }
    }
}
