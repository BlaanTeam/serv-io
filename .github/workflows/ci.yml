name: ci

on:
  push:
    branches: [master, v2]
  pull_request:
    branches: [master, v2]

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build (debug + ASan)
        run: make -j$(getconf _NPROCESSORS_ONLN)

      - name: Unit tests
        run: make test-unit

      - name: End-to-end tests
        run: make test-e2e

      - name: Build (release)
        run: |
          make fclean
          make release
